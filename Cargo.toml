[package]
name = "auditgate"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
scraper = "0.27.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
